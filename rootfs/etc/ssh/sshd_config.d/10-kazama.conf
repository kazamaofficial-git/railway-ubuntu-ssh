# ============================================================
# Kazama — sshd drop-in (loaded via `Include` in sshd_config)
# Developer  : @kazamaofficial-git
# Repository : https://github.com/kazamaofficial-git/railway-ubuntu-ssh
# ============================================================
# sshd keeps the FIRST value it reads for a keyword; the Include line sits
# at the top of sshd_config, so these settings take precedence.

# Direct root login with a password (the container refuses to start
# without ROOT_PASSWORD). Use AUTHORIZED_KEYS for key-based login too.
PermitRootLogin yes
PasswordAuthentication yes

# Railway's TCP proxy drops idle connections — send keepalives.
ClientAliveInterval 60
ClientAliveCountMax 5
TCPKeepAlive yes

# Slightly tighter defaults.
X11Forwarding no
MaxAuthTries 4
LoginGraceTime 30
