# ============================================================
# Kazama Debloat Catalog (Linux) — what `booster.sh max` may remove
# Developer  : @kazamaofficial-git
# ============================================================
# One entry per line:   id | Name | folders (;-separated, wildcards ok) | apt packages (space-separated, wildcards ok) | services
# Each entry only runs when something it names is actually present, so one catalog works on
# ubuntu-latest, ubuntu-24.04 and ubuntu-22.04. Protect entries with the `keep` input
# (comma separated ids). Google Chrome is not in this list on purpose.
android   | Android SDK / NDK                  | /usr/local/lib/android;/home/*/.android                                  |                                          |
dotnet    | .NET SDKs                           | /usr/share/dotnet;/usr/lib/dotnet;/home/*/.dotnet                        | dotnet-* aspnetcore-*                    |
haskell   | Haskell (GHC, Cabal, ghcup, Stack)  | /opt/ghc;/usr/local/.ghcup;/home/*/.ghcup;/home/*/.cabal;/home/*/.stack  | ghc cabal-install                        |
r         | R language                          | /usr/lib/R;/usr/local/lib/R;/usr/share/R                                 | r-base r-base-core r-base-dev r-cran-*   |
julia     | Julia                               | /usr/local/julia*;/home/*/.julia                                         |                                          |
swift     | Swift                               | /usr/share/swift                                                         |                                          |
mono      | Mono                                | /usr/lib/mono                                                            | mono-complete mono-runtime mono-devel    |
php       | PHP                                 | /usr/lib/php                                                             | php*                                     |
mysql     | MySQL                               | /var/lib/mysql;/etc/mysql                                                | mysql-server* mysql-client* mysql-common | mysql
postgresql| PostgreSQL                          | /var/lib/postgresql;/usr/lib/postgresql;/etc/postgresql                  | postgresql*                              | postgresql
mongodb   | MongoDB                             | /var/lib/mongodb                                                         | mongodb* mongodb-org*                    | mongod
azure     | Azure CLI                           | /opt/az                                                                  | azure-cli                                |
gcloud    | Google Cloud SDK                    | /usr/lib/google-cloud-sdk                                                | google-cloud-cli google-cloud-sdk        |
powershell| PowerShell                          | /opt/microsoft/powershell                                                | powershell                               |
edge      | Microsoft Edge                      | /opt/microsoft/msedge                                                    | microsoft-edge-stable                    |
firefox   | Firefox                             | /usr/lib/firefox;/opt/hostedtoolcache/firefox                            | firefox                                  |
codeql    | CodeQL bundle                       | /opt/hostedtoolcache/CodeQL                                              |                                          |
miniconda | Miniconda                           | /usr/share/miniconda;/usr/local/miniconda;/home/*/miniconda3             |                                          |
llvm      | LLVM / Clang                        | /usr/lib/llvm-*                                                          | clang-* llvm-* lld-* libclang-*          |
rust      | Rust (cargo, rustup)                | /home/*/.cargo;/home/*/.rustup;/usr/share/rust                           |                                          |
