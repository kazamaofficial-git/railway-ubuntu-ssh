name: Kazama SSH (Tailscale)

run-name: "Kazama SSH · ${{ inputs.ubuntu }} · boost ${{ inputs.boost }}"

on:
  workflow_dispatch:
    inputs:
      ubuntu:
        description: "Ubuntu runner"
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
      boost:
        description: "Storage Booster: safe = caches | deep = + apt lists/journal | max = + removes apps/SDKs (Android, .NET, Haskell, R, Edge, Firefox...)"
        type: choice
        default: max
        options: ["off", "safe", "deep", "max"]
      keep:
        description: "Apps to KEEP in max mode (comma separated ids, see scripts/linux-catalog.conf). Chrome is always kept."
        type: string
        default: "chrome"
      duration:
        description: "Max session length in minutes (5-345)"
        type: string
        default: "330"
      idle_timeout:
        description: "Stop after N minutes with no SSH session (0 = never)"
        type: string
        default: "30"
      username:
        description: "Optional sudo user (created only when the SSH_PASSWORD secret is set)"
        type: string
        default: "kazama"
      tailscale_hostname:
        description: "Tailscale machine name (empty = kazama-ssh-<run id>)"
        type: string
        default: ""
      packages:
        description: "Optional apt packages, e.g. htop,ncdu,tmux"
        type: string
        default: ""
      save_files:
        description: "Upload /root/src and the sudo user's home as an artifact when the session ends"
        type: boolean
        default: false
      language:
        description: "Log language"
        type: choice
        default: en
        options: [en, id]

permissions:
  contents: read

concurrency:
  group: kazama-ssh
  cancel-in-progress: false

jobs:
  ssh:
    name: Kazama SSH (${{ inputs.ubuntu }})
    runs-on: ${{ inputs.ubuntu }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      KZ_LANG: ${{ inputs.language }}
      KZ_UBUNTU: ${{ inputs.ubuntu }}
      KZ_BOOST: ${{ inputs.boost }}
      KZ_KEEP: ${{ inputs.keep }}
      KZ_DURATION: ${{ inputs.duration }}
      KZ_IDLE: ${{ inputs.idle_timeout }}
      KZ_TS_HOSTNAME: ${{ inputs.tailscale_hostname }}
      KZ_PACKAGES: ${{ inputs.packages }}
      KZ_SAVE_FILES: ${{ inputs.save_files }}
      SSH_USERNAME: ${{ inputs.username }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Storage Booster
        if: inputs.boost != 'off'
        run: bash scripts/booster.sh "$KZ_BOOST"

      - name: Set up SSH
        env:
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
          ROOT_PASSWORD_VAR: ${{ vars.ROOT_PASSWORD }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PASSWORD_VAR: ${{ vars.SSH_PASSWORD }}
          AUTHORIZED_KEYS: ${{ secrets.AUTHORIZED_KEYS }}
        run: bash scripts/setup-ssh.sh

      - name: Install extra packages
        if: inputs.packages != ''
        run: bash scripts/install-packages.sh

      - name: Tailscale
        id: tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TAILSCALE_AUTHKEY_VAR: ${{ vars.TAILSCALE_AUTHKEY }}
        run: bash scripts/tunnel-tailscale.sh

      - name: Show connection details
        env:
          KZ_HOST: ${{ steps.tailscale.outputs.host }}
          KZ_NAME: ${{ steps.tailscale.outputs.name }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PASSWORD_VAR: ${{ vars.SSH_PASSWORD }}
        run: bash scripts/show-connection.sh

      - name: Keep session alive
        run: bash scripts/keepalive.sh

      - name: Cleanup
        if: always()
        run: bash scripts/cleanup.sh

      - name: Upload saved files
        if: always() && inputs.save_files
        uses: actions/upload-artifact@v4
        with:
          name: kazama-ssh-files-${{ github.run_id }}
          path: ${{ runner.temp }}/kazama-files
          if-no-files-found: ignore
          retention-days: 3
